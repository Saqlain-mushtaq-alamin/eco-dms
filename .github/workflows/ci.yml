name: EcoDMS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Smart Contract Tests ──────────────────────────────────────────────────
  contracts:
    name: 🔗 Contract Tests (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts (with viaIR)
        run: npx hardhat compile

      - name: Run all contract tests
        run: npx hardhat test

      - name: Check contract sizes
        run: npx hardhat size-contracts || true

      - name: Gas report (informational)
        env:
          REPORT_GAS: "true"
          GAS_REPORT_FILE: gas-report.txt
        run: npx hardhat test || true

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-report
          path: contracts/gas-report.txt
          if-no-files-found: ignore

  # ── Backend Unit + Integration Tests ─────────────────────────────────────
  backend:
    name: 🐍 Backend Tests (pytest)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pillow

      - name: Run unit tests (app)
        working-directory: .
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          python -m pytest backend/app/tests/ -v \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-app.xml \
            --cov-fail-under=40 \
            -x || true

      - name: Run service integration tests
        working-directory: .
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          python -m pytest backend/tests/test_services_integration.py -v \
            --cov=backend \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            -x

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage-app.xml
            coverage-integration.xml

  # ── Backend Lint (ruff) ───────────────────────────────────────────────────
  backend-lint:
    name: 🧹 Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend (ruff)
        run: |
          ruff check backend/ \
            --ignore E501,E402,F401 \
            --exit-zero

  # ── Frontend Type-Check ───────────────────────────────────────────────────
  frontend:
    name: ⚛️  Frontend Type-Check (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build UI package
        run: pnpm --filter @eco-dms/ui build
        working-directory: .

      - name: Type-check frontend
        run: npx tsc --noEmit

  # ── Frontend Lint (ESLint) ────────────────────────────────────────────────
  frontend-lint:
    name: 🧹 Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend (eslint)
        working-directory: apps/web
        run: npx eslint src --ext .ts,.tsx --max-warnings 50 || true

  # ── Solidity Lint ─────────────────────────────────────────────────────────
  solidity-lint:
    name: 🧹 Solidity Lint (solhint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install solhint
        run: npm install --save-dev solhint

      - name: Run solhint
        run: npx solhint 'contracts/**/*.sol' --max-warnings 20 || true

  # ── Deploy (dry run on PR, real on main) ─────────────────────────────────
  deploy-check:
    name: 🚀 Deploy Dry-Run (localhost)
    runs-on: ubuntu-latest
    needs: [contracts]
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start Hardhat node (background)
        run: npx hardhat node &
        # Give node time to start
      - name: Wait for node
        run: sleep 5

      - name: Run full deploy script on localhost
        run: npx hardhat run scripts/deploy-all.ts --network localhost
        env:
          DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

      - name: Verify deployment artifacts written
        run: |
          test -f deployments/localhost.json && echo "✅ Deployment JSON written" || echo "❌ Missing"
          test -f ../backend/.env.contracts   && echo "✅ Backend .env written"   || echo "❌ Missing"
          test -f ../apps/web/.env.local       && echo "✅ Frontend .env written"  || echo "❌ Missing"

  # ── Summary gate ─────────────────────────────────────────────────────────
  ci-gate:
    name: ✅ CI Gate
    runs-on: ubuntu-latest
    needs: [contracts, backend, frontend, deploy-check]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [ "${{ needs.contracts.result }}" != "success" ]; then
            echo "❌ Contract tests failed"; exit 1
          fi
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "❌ Backend tests failed"; exit 1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Frontend type-check failed"; exit 1
          fi
          if [ "${{ needs.deploy-check.result }}" != "success" ]; then
            echo "❌ Deploy dry-run failed"; exit 1
          fi
          echo "✅ All required CI jobs passed"
