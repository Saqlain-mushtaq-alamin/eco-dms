specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  # ==================
  # REWARD TOKEN CONTRACT
  # ==================
  - kind: ethereum/contract
    name: RewardToken
    network: hardhat # Change to 'mainnet', 'goerli', 'polygon', etc. for production
    source:
      address: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707" # Will be updated by deployment script
      abi: RewardToken
      startBlock: 0 # Set to deployment block for faster indexing
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - TokenTransfer
      abis:
        - name: RewardToken
          file: ./abis/RewardToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTokenTransfer
        - event: MinterAdded(indexed address)
          handler: handleMinterAdded
        - event: MinterRemoved(indexed address)
          handler: handleMinterRemoved
      file: ./src/reward-token-mapping.ts

  # ==================
  # VERIFICATION CONTRACT
  # ==================
  - kind: ethereum/contract
    name: Verification
    network: hardhat # Change to 'mainnet', 'goerli', 'polygon', etc. for production
    source:
      address: "0x0165878A594ca255338adfa4d48449f69242Eb8F" # Will be updated by deployment script
      abi: Verification
      startBlock: 0 # Set to deployment block for faster indexing
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Post
        - Verification
        - Reward
        - GlobalStats
      abis:
        - name: Verification
          file: ./abis/Verification.json
        - name: RewardToken
          file: ./abis/RewardToken.json
      eventHandlers:
        - event: PostVerified(indexed string,indexed address,bool,uint256,uint256,uint256)
          handler: handlePostVerified
        - event: RewardMinted(indexed address,indexed string,uint256,uint256)
          handler: handleRewardMinted
        - event: VerifierAdded(indexed address)
          handler: handleVerifierAdded
        - event: VerifierRemoved(indexed address)
          handler: handleVerifierRemoved
      file: ./src/verification-mapping.ts

  # ==================
  # PROFILE REGISTRY CONTRACT (Optional - if you want to keep handles)
  # ==================
  - kind: ethereum/contract
    name: ProfileRegistry
    network: hardhat
    source:
      address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9" # Replace after deploy
      abi: ProfileRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
      abis:
        - name: ProfileRegistry
          file: ./abis/ProfileRegistry.json
      eventHandlers:
        - event: ProfileCreated(indexed address,string)
          handler: handleProfileCreated
      file: ./src/profile-mapping.ts

