version: "3.9"
services:
  ipfs:
    image: ipfs/kubo:latest
    # Override entrypoint so we can patch the config on every startup.
    # This fixes two common issues:
    #   1. API bound to 127.0.0.1 inside the container (Docker can't forward to it)
    #   2. CORS headers missing, causing 403 on /api/v0/* from Python clients
    entrypoint: |
      /bin/sh -c "
        [ ! -f /data/ipfs/config ] && ipfs init --profile=server;
        ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001;
        ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8080;
        ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin '[\"*\"]';
        ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods '[\"PUT\", \"POST\", \"GET\"]';
        ipfs config --json API.HTTPHeaders.Access-Control-Allow-Headers '[\"Authorization\", \"X-Requested-With\"]';
        exec ipfs daemon --migrate=true
      "
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: graph
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10
  graph-node:
    image: graphprotocol/graph-node:latest
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: postgres
      postgres_port: 5432
      postgres_user: postgres
      postgres_pass: postgres
      postgres_db: graph
      ipfs: ipfs:5001
      ethereum: hardhat:http://host.docker.internal:8545
      GRAPH_LOG: info
    ports:
      - "8001:8000"
volumes:
  ipfs_data:
