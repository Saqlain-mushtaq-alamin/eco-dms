name: EcoDMS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Smart Contract Tests ─────────────────────────────────────
  contracts:
    name: Contract Tests (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

      - name: Check contract sizes
        run: npx hardhat size-contracts || true

  # ── Backend Tests ────────────────────────────────────────────
  backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run backend tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          python -m pytest app/tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=50 || true

  # ── Frontend Type-Check ──────────────────────────────────────
  frontend:
    name: Frontend Type-Check (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build UI package
        run: pnpm --filter @eco-dms/ui build
        working-directory: .

      - name: Type-check frontend
        run: npx tsc --noEmit

  # ── Lint ─────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint contracts (solhint)
        working-directory: contracts
        run: npx solhint 'contracts/**/*.sol' || true

      - name: Lint frontend (eslint)
        working-directory: apps/web
        run: npx eslint src --ext .ts,.tsx --max-warnings 50 || true
