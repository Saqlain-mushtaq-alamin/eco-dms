specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: RewardToken
    network: hardhat
    source:
      address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      abi: RewardToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - TokenTransfer
      abis:
        - name: RewardToken
          file: RewardToken\abis\RewardToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTokenTransfer
        - event: MinterAdded(indexed address)
          handler: handleMinterAdded
        - event: MinterRemoved(indexed address)
          handler: handleMinterRemoved
      file: RewardToken\RewardToken.wasm
  - kind: ethereum/contract
    name: Verification
    network: hardhat
    source:
      address: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
      abi: Verification
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Post
        - Verification
        - Reward
        - GlobalStats
      abis:
        - name: Verification
          file: Verification\abis\Verification.json
        - name: RewardToken
          file: Verification\abis\RewardToken.json
      eventHandlers:
        - event: PostVerified(indexed string,indexed address,bool,uint256,uint256,uint256)
          handler: handlePostVerified
        - event: RewardMinted(indexed address,indexed string,uint256,uint256)
          handler: handleRewardMinted
        - event: VerifierAdded(indexed address)
          handler: handleVerifierAdded
        - event: VerifierRemoved(indexed address)
          handler: handleVerifierRemoved
      file: Verification\Verification.wasm
  - kind: ethereum/contract
    name: ProfileRegistry
    network: hardhat
    source:
      address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      abi: ProfileRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
      abis:
        - name: ProfileRegistry
          file: ProfileRegistry\abis\ProfileRegistry.json
      eventHandlers:
        - event: ProfileCreated(indexed address,string)
          handler: handleProfileCreated
      file: ProfileRegistry\ProfileRegistry.wasm
